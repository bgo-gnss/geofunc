[project]
name = "geofunc"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" },
    { name = "Maria Fernanda Gonzalez", email = "mariagr@vedur.is" },
]
maintainers = [{ name = "Benedikt Gunnar Ófeigsson", email = "bgo@vedur.is" }]

requires-python = ">=3.13"
dependencies = [
    "pyproj>=3.6",
    "numpy>=1.26",
]

[project.scripts]
geofunc = "geofunc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["scripts/legacy"]

[tool.mypy]
exclude = ["scripts/legacy/"]
# local.py/coords.py are typed; geo.py/geofunc.py are legacy (to be retired)

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "geopandas.*",
    "cparser",
    "gps_parser.*",
    "gtimes.*",
    "geo_dataread.*",
]
ignore_missing_imports = true
